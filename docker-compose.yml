services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: app
    restart: unless-stopped
    ports:
      - "8082:8082"
      - "5173:5173"
    volumes:
      - .:/var/www
    environment:
      DB_CONNECTION: ${DB_CONNECTION:-mysql}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE:-ms0}
      DB_USERNAME: ${DB_USERNAME:-msamgan}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
    networks:
      - database_default

networks:
  database_default:
    external: true
