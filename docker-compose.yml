services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: 301ping
        restart: unless-stopped
        ports:
            - "8082:8082"
            - "5173:5173"
        volumes:
            - .:/var/www
        environment:
            DB_CONNECTION: ${DB_CONNECTION:-mysql}
            DB_HOST: ${DB_HOST:-db}
            DB_PORT: ${DB_PORT:-3306}
            DB_DATABASE: ${DB_DATABASE:-301ping}
            DB_USERNAME: ${DB_USERNAME:-root}
            DB_PASSWORD: ${DB_PASSWORD:-root_password}
        networks:
            - database_default

networks:
    database_default:
        external: true
